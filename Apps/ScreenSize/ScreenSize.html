<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Size Display</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../Common/navSmallBottom.css" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      /* Basic styles for the container */
      body {
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
        height: 100vh;
        font-family: "Poppins", serif;
        padding: 20px;
      }
      .heading {
        font-size: 20px;
        margin: 10px;
        font-weight: 500;
        text-transform: capitalize;
      }
      .x {
        font-size: 40px;
        position: relative;
        top: 60px;
        font-weight: 700;
        margin: 0px 30px;
      }
      .container {
        background: linear-gradient(45deg, #8200ff 0%, #2d5eff 100%);
        color: white;
        padding: 40px 70px;
        border-radius: 20px;
      }
      .widhtValue,
      .heightValue {
        font-size: 100px;
        font-weight: 900;
      }
      .widthConatiner {
        position: relative;
      }
      .widthText,
      .heightText {
        position: absolute;
        font-weight: 300;
      }

      .heightConatiner {
        display: flex;
        justify-content: end;
        position: relative;
        margin-top: -30px;
      }
      .heightText {
        bottom: 0;
        right: 0;
      }
      @media screen and (max-width: 400px) {
        .container {
          padding: 40px 40px;
          width: 100%;
        }
        .x {
          margin: 0px 10px;
        }
        .heading {
          width: 100%;
          text-align: center;
        }
      }
      @media screen and (max-width: 350px) {
        .x {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- !===============Logo Nav================ -->
    <div id="bottomNavContainer"></div>
    <!-- !===============Logo Nav================ -->
    <h1 class="heading">Your current screen size is</h1>

    <div class="container">
      <div class="widthConatiner">
        <span class="widthText">Width </span>
        <p class="widhtValue">1280</p>
      </div>
      <div class="heightConatiner">
        <p class="x">x</p>
        <p class="heightValue">897</p>
        <span class="heightText">Height </span>
      </div>
      <!-- <p id="screen-size">Width: 0px, Height: 0px</p> -->
    </div>

    <script>
      function showScreenSize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        document.querySelector(".widhtValue").textContent = width;
        document.querySelector(".heightValue").textContent = height;
      }

      showScreenSize();

      window.addEventListener("resize", showScreenSize);
    </script>
    <script src="../Common/navSmallBottom.js"></script>
  </body>
</html>
